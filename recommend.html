    let lastIndex = -1;

    function pickRandomItem() {
      let randomIndex;
      if (origamiData.length === 1) {
        randomIndex = 0;
      } else {
        do {
          randomIndex = Math.floor(Math.random() * origamiData.length);
        } while (randomIndex === lastIndex);
      }
      
      lastIndex = randomIndex;
      const item = origamiData[randomIndex];

      // DOM 업데이트
      document.getElementById('itemThumbnail').src = item.thumbnail;
      document.getElementById('itemTitle').innerText = item.title;
      document.getElementById('itemCreator').innerText = `👤 ${item.creator}`;
      document.getElementById('itemTarget').innerText = `🎯 ${item.target}`;
      document.getElementById('itemDesc').innerText = item.desc;
      
      document.getElementById('itemPlayLink').href = item.url;
      document.getElementById('itemLink').href = item.url;

      // 태그 변환
      const tagsContainer = document.getElementById('itemTags');
      tagsContainer.innerHTML = item.tags
        .map(tag => `<span class="text-xs bg-amber-50 text-amber-800 px-2.5 py-1 rounded-md font-semibold border border-amber-200">#${tag}</span>`)
        .join('');

      lucide.createIcons();
    }

    // 페이지 진입 시 최초 1회 실행
    document.addEventListener('DOMContentLoaded', () => {
      pickRandomItem();
    });
  </script>
</body>
</html>
