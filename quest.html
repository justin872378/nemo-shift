        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;

                radial-gradient(#e2e8f0 1.5px, #f8fafc 1.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        /* Paper crease & origami shadow utility classes */
        .paper-shadow {
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        }
        
        .paper-crease {
            position: relative;
        }
        .paper-crease::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(0,0,0,0.03) 100%);
            pointer-events: none;
            border-radius: inherit;
        }

        /* SVG Path animations & styles */
        .roadmap-path-bg {
            stroke: #cbd5e1;
            stroke-dasharray: 8, 8;
            stroke-width: 6;
            fill: none;
        }

        .roadmap-path-active {
            stroke: #f59e0b;
            stroke-width: 8;
            fill: none;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s ease-in-out;
        }

        /* Stamp animation */
        @keyframes stamp-pop {
            0% { transform: scale(3) rotate(-20deg); opacity: 0; }
            50% { transform: scale(0.9) rotate(-10deg); opacity: 1; }
            75% { transform: scale(1.05) rotate(-12deg); }
            100% { transform: scale(1) rotate(-12deg); opacity: 0.9; }
        }
        
        .stamp-animated {
            animation: stamp-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>

        thumbnail: "https://img.youtube.com/vi/oRKLJwXar18/hqdefault.jpg",

{

  title: "해왕류 어룡(魚龍) 접기 Part 1 머리부분 접기 / 드래곤 종이접기",
level: "Lv.5 마스터",
  creator: "종이접는 도토리",
  target: "고급 / 드래곤·해왕류",
  desc: "바다에 사는 어룡(魚龍) 접는 방법중 머리부분 접기 영상입니다. 길다란 몸통에 무수히 달린 비늘, 물갈퀴가 달린 머리부분이 큰 특징입니다. 풀먹인 한지 15cm X 200cm 아주 길다란 종이로 접었습니다.",

level: "Lv.5 마스터",
  creator: "종이접는 도토리",
  target: "고급 / 드래곤·해왕류",
  desc: "PART1에 이어서 어룡 몸통과 꼬리접기 영상입니다. 영상에서는 짧은 종이로 접었지만 실제로는 2미터 되는 길다란 종이로 접어야 멋있게 만들어 집니다.",
  thumbnail: "https://img.youtube.com/vi/2JY8RjedoPo/hqdefault.jpg",

}
    ];

    /* 
     * 총 20개 노드로 확장 (수집된 18개 + 남은 2개 빈 슬롯 자동 생성)
     */
    const questData = Array.from({ length: 20 }, (_, i) => {
        const levelNum = i + 1;
        let xOffset = 50; 
        if (i % 4 === 1) xOffset = 22;      // Left shift
        else if (i % 4 === 3) xOffset = 78; // Right shift

        // 수집된 데이터가 있으면 그 데이터를 사용하고, 없으면 빈 슬롯 생성
        const existingItem = manualQuestData.find(item => item.id === levelNum);

        if (existingItem) {
            return {
                ...existingItem,
                difficulty: levelNum <= 5 ? '초급 (입문)' : levelNum <= 12 ? '중급 (장난감)' : levelNum <= 17 ? '고급 (로봇/캐릭터)' : '마스터 (전설)',
                xPct: xOffset,
                yPx: i * 110 + 40
            };
        } else {
            return {
                id: levelNum,
                title: `Level ${levelNum}: 작품 준비 중`,
                level: 'Lv.5 마스터',
                creator: '크리에이터 미정',
                difficulty: '마스터 (전설)',
                target: '미정',
                desc: '추후 수집 및 등록될 종이접기 퀘스트 작품 슬롯입니다.',
                thumbnail: '',
                url: '#',
                tags: ['종이접기', `단계${levelNum}`],
                xPct: xOffset,
                yPx: i * 110 + 40
            };
        }
    });

    /* 
     * LocalStorage State Management & Initialization
     */
    const STORAGE_KEY = 'nemo_shift_quest_progress_v1';
    let completedSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
    let activeModalLevelId = null;

    document.addEventListener('DOMContentLoaded', () => {
        renderRoadmapNodes();
        updateRoadmapPath();
        updateProgress();

        window.addEventListener('resize', updateRoadmapPath);
    });

    /* 
     * Render 20 Milestone Checkpoints on Page
     */
    function renderRoadmapNodes() {
        const container = document.getElementById('nodes-container');
        if (!container) return;
        container.innerHTML = '';

        questData.forEach((node, idx) => {
            const isCompleted = completedSet.has(node.id);
            const isUnlocked = node.id === 1 || completedSet.has(node.id - 1);

            const nodeEl = document.createElement('div');
            nodeEl.className = 'absolute transform -translate-x-1/2 -translate-y-1/2 transition-all duration-300';
            nodeEl.style.left = `${node.xPct}%`;
            nodeEl.style.top = `${node.yPx}px`;

            let buttonStyle = 'bg-slate-200 text-slate-400 border-slate-300 cursor-not-allowed opacity-80';
            let iconHtml = `<i class="fa-solid fa-lock text-slate-400"></i>`;
            let badgeClass = 'bg-slate-100 text-slate-500 border-slate-200';

            if (isCompleted) {
                buttonStyle = 'bg-emerald-500 text-white border-emerald-600 shadow-lg shadow-emerald-500/30 hover:scale-110';
                iconHtml = `<i class="fa-solid fa-check text-xl"></i>`;
                badgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200 font-bold';
            } else if (isUnlocked) {
                buttonStyle = 'bg-amber-500 text-white border-amber-600 shadow-xl shadow-amber-500/40 hover:scale-110 animate-bounce';
                iconHtml = `<i class="fa-solid fa-paper-plane text-lg"></i>`;
                badgeClass = 'bg-amber-50 text-amber-700 border-amber-300 font-extrabold';
            }

            nodeEl.innerHTML = `
                <div class="flex flex-col items-center group">
                    <button onclick="openModal(${node.id})" 
                            ${!isUnlocked ? 'disabled' : ''} 
                            class="w-14 h-14 rounded-2xl border-2 flex items-center justify-center transition-transform duration-200 paper-shadow relative z-10 cursor-pointer ${buttonStyle}">
                        ${iconHtml}
                        ${isCompleted ? '<div class="absolute -top-2 -right-2 bg-emerald-600 text-[10px] font-black text-white px-1.5 py-0.5 rounded-full shadow">완료</div>' : ''}
                    </button>

                    <div class="mt-2 text-center bg-white/90 backdrop-blur-sm border border-slate-200/80 px-3 py-1.5 rounded-xl shadow-sm max-w-[160px] paper-crease">
                        <span class="inline-block px-1.5 py-0.5 text-[10px] rounded border mb-1 ${badgeClass}">
                            LV.${node.id}
                        </span>
                        <p class="text-xs font-bold text-slate-800 truncate leading-snug">${node.title}</p>
                    </div>
                </div>
            `;

            container.appendChild(nodeEl);
        });
    }

    /* 
     * Draw SVG Winding Path Connecting All 20 Points
     */
    function updateRoadmapPath() {
        const svgBgPath = document.getElementById('svg-bg-path');
        const container = document.getElementById('roadmap-container');
        if (!container || !svgBgPath) return;

        const containerWidth = container.offsetWidth;
        let pathD = '';

        questData.forEach((node, i) => {
            const x = (node.xPct / 100) * containerWidth;
            const y = node.yPx;

            if (i === 0) {
                pathD += `M ${x} ${y}`;
            } else {
                const prevNode = questData[i - 1];
                const prevX = (prevNode.xPct / 100) * containerWidth;
                const prevY = prevNode.yPx;

                const cy1 = prevY + 55;
                const cy2 = y - 55;

                pathD += ` C ${prevX} ${cy1}, ${x} ${cy2}, ${x} ${y}`;
            }
        });

        svgBgPath.setAttribute('d', pathD);
    }

    /* 
     * Update Completion Progress & Stats
     */
    function updateProgress() {
        const count = completedSet.size;
        const percent = Math.round((count / 20) * 100);

        const textEl = document.getElementById('progress-text');
        const percentEl = document.getElementById('progress-percent');
        const barEl = document.getElementById('progress-bar');

        if (textEl) textEl.innerText = `${count} / 20`;
        if (percentEl) percentEl.innerText = `${percent}%`;
        if (barEl) barEl.style.width = `${percent}%`;
    }

    /* 
     * Modal Drawer Open/Close & Level Detail Interactivity
     */
    function openModal(levelId) {
        const node = questData.find(n => n.id === levelId);
        if (!node) return;

        activeModalLevelId = levelId;
        const isCompleted = completedSet.has(levelId);

        const modalBody = document.getElementById('modal-body');
        const toggleBtnText = document.getElementById('toggle-btn-text');
        const toggleBtn = document.getElementById('toggle-complete-btn');

        let thumbnailHtml = '';
        if (node.thumbnail) {
            thumbnailHtml = `
                <div class="relative group aspect-video bg-slate-100 rounded-xl overflow-hidden border-2 border-slate-900 shadow-inner mb-3">
                    <img src="${node.thumbnail}" alt="${node.title}" class="w-full h-full object-cover">
                    ${node.url && node.url !== '#' ? `
                    <a href="${node.url}" target="_blank" class="absolute inset-0 bg-slate-900/30 flex items-center justify-center opacity-90 hover:opacity-100 transition-opacity">
                        <div class="w-12 h-12 bg-amber-400 border-2 border-slate-900 rounded-full flex items-center justify-center text-slate-900 shadow-[2px_2px_0px_#000]">
                            <i class="fa-solid fa-play ml-0.5"></i>
                        </div>
                    </a>` : ''}
                </div>
            `;
        } else {
            thumbnailHtml = `
                <div class="bg-slate-100 border border-slate-200 rounded-xl p-4 text-center my-3">
                    <i class="fa-solid fa-box-open text-3xl mb-2 block text-slate-400"></i>
                    <p class="text-xs font-bold text-slate-600">추후 추천 데이터 수집 슬롯</p>
                    <p class="text-[11px] text-slate-400 mt-1">유튜브 동영상 썸네일 대기 중</p>
                </div>
            `;
        }

        modalBody.innerHTML = `
            <div class="flex items-center gap-2 mb-1">
                <span class="bg-amber-100 text-amber-800 text-xs font-black px-2.5 py-1 rounded-md">LEVEL ${node.id}</span>
                <span class="bg-slate-100 text-slate-600 text-xs font-bold px-2.5 py-1 rounded-md">${node.difficulty}</span>
            </div>
            <h3 class="text-xl font-black text-slate-800 tracking-tight leading-snug">${node.title}</h3>
            <p class="text-xs text-slate-500 font-semibold mb-2"><i class="fa-regular fa-user mr-1"></i>${node.creator}</p>
            
            ${thumbnailHtml}

            <p class="text-xs text-slate-600 leading-relaxed bg-amber-50/50 p-3 rounded-lg border border-amber-100/80 mb-3">
                ${node.desc}
            </p>

            ${node.url && node.url !== '#' ? `
            <a href="${node.url}" target="_blank" class="paper-btn block text-center bg-amber-400 hover:bg-amber-300 text-slate-900 font-extrabold text-xs py-2.5 rounded-xl border-2 border-slate-900 flex items-center justify-center gap-2 mb-3">
                <span>유튜브에서 영상 보기</span>
                <i class="fa-solid fa-external-link-alt"></i>
            </a>` : ''}

            <div>
                ${isCompleted 
                    ? `<div class="bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-2">
                        <i class="fa-solid fa-circle-check text-emerald-600 text-sm"></i>
                        <span>이 단계의 종이접기 도장을 이미 수집했습니다!</span>
                       </div>`
                    : `<div class="bg-slate-50 border border-slate-200 text-slate-600 text-xs font-medium px-3 py-2 rounded-xl flex items-center gap-2">
                        <i class="fa-solid fa-circle-info text-amber-500 text-sm"></i>
                        <span>종이접기를 완료하셨다면 아래 버튼을 누르세요.</span>
                       </div>`
                }
            </div>
        `;

        if (isCompleted) {
            if (toggleBtnText) toggleBtnText.innerText = '도장 취소하기';
            if (toggleBtn) toggleBtn.className = 'px-4 py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-sm transition-all flex-1 flex items-center justify-center gap-2';
        } else {
            if (toggleBtnText) toggleBtnText.innerText = '도장 찍기 (완료)';
            if (toggleBtn) toggleBtn.className = 'px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm shadow-md transition-all flex-1 flex items-center justify-center gap-2';
        }

        const modal = document.getElementById('quest-modal');
        const modalCard = document.getElementById('modal-card');
        if (modal && modalCard) {
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalCard.classList.remove('scale-95', 'opacity-0');
                modalCard.classList.add('scale-100', 'opacity-100');
            }, 10);
        }
    }

    function closeModal() {
        const modal = document.getElementById('quest-modal');
        const modalCard = document.getElementById('modal-card');
        if (!modal || !modalCard) return;

        modalCard.classList.remove('scale-100', 'opacity-100');
        modalCard.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
            modal.classList.add('hidden');
            activeModalLevelId = null;
        }, 150);
    }

    /* 
     * Toggle Quest Completion State & Save to LocalStorage
     */
    const toggleBtn = document.getElementById('toggle-complete-btn');
    if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
            if (activeModalLevelId === null) return;

            if (completedSet.has(activeModalLevelId)) {
                completedSet.delete(activeModalLevelId);
            } else {
                completedSet.add(activeModalLevelId);
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(completedSet)));

            renderRoadmapNodes();
            updateProgress();
            closeModal();
        });
    }

    /* 
     * Reset Progress Confirmation
     */
    function confirmReset() {
        if (completedSet.size === 0) {
            alert('완료된 도장 기록이 없습니다.');
            return;
        }
        if (window.confirm('모든 도장깨기 기록을 초기화하시겠습니까?')) {
            completedSet.clear();
            localStorage.removeItem(STORAGE_KEY);
            renderRoadmapNodes();
            updateProgress();
        }
    }
</script>
